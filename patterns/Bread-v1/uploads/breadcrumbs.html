<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Навигация по разделам с поиском на каждом уровне.">
  <title>Путь — навигация</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23e1efff'/%3E%3Cpath d='m12 9 7 7-7 7' fill='none' stroke='%233766a4' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#253342;background:#fff;font-synthesis:none;color-scheme:light;--muted:#73818f;--blue:#3c78b7}
*{box-sizing:border-box}
body{margin:0;min-height:100svh}
button,input{font:inherit}
button{color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid #4d90d4;outline-offset:4px}
[hidden]{display:none!important}
main{min-height:100svh;padding:52px 54px}
.navigation{position:relative;width:fit-content;max-width:100%;z-index:2}
.breadcrumbs{list-style:none;display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:0;padding:0;row-gap:18px}
.crumb-wrap{display:flex;align-items:center;min-width:0}
.crumb{position:relative;display:flex;align-items:center;gap:15px;min-height:76px;padding:13px 18px 13px 14px;border:1px solid rgba(201,215,230,.65);border-radius:23px;background:linear-gradient(115deg,rgba(224,240,254,.72),rgba(245,246,249,.85) 65%,rgba(255,236,222,.62));box-shadow:0 3px 6px -3px #8198b523,0 12px 24px -18px #668bae3d,inset 0 1px 1px #fff;backdrop-filter:blur(20px);cursor:pointer;text-align:left;transition:border-color .18s,box-shadow .18s,background .18s;isolation:isolate}
.crumb:hover,.crumb[aria-expanded=true]{border-color:#b8d0e9;background:linear-gradient(115deg,#e2f0ffdd,#f3f5f9ee 62%,#ffe9d8c9);box-shadow:0 5px 12px -7px #6992bc44,0 15px 35px -20px #5697cb60,inset 0 1px 1px #fff}
.crumb[aria-current=page]{border-color:#c4d7e9}
.crumb-icon{display:grid;place-items:center;flex-shrink:0;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--icon-light),var(--icon-color));box-shadow:inset 0 1px 1px #ffffffb0;color:var(--icon-ink)}
.crumb-icon svg{width:22px;height:22px}
.crumb-copy{display:flex;flex-direction:column;gap:5px;min-width:0}
.crumb-label{font-size:18px;line-height:1.2;font-weight:550;letter-spacing:-.35px;white-space:nowrap}
.crumb-code{font-size:12px;line-height:1;letter-spacing:.055em;color:#778492;font-variant-numeric:tabular-nums}
.caret{margin-left:12px;width:15px;height:15px;color:#8497aa;flex-shrink:0;transition:transform .18s,color .18s}
.crumb[aria-expanded=true] .caret{transform:rotate(180deg);color:#4d7aab}
.connector{display:flex;align-items:center;justify-content:center;width:43px;height:32px;color:#a5b6c7;flex-shrink:0}
.connector:before,.connector:after{content:"";height:1px;width:10px;background:#dce5ee}
.connector svg{width:14px;height:14px;flex-shrink:0}
.crumb-add{width:52px;min-height:52px;padding:0;justify-content:center;border-radius:17px;color:#6d8ca8}
.crumb-add svg{height:20px;width:20px}
.picker{position:fixed;z-index:5;width:358px;border:1px solid #d7e1ecaa;border-radius:25px;padding:18px 13px 12px;background:radial-gradient(ellipse at 0 0,#dcedffcf,transparent 65%),radial-gradient(ellipse at 110% 5%,#ffdfc4b8,transparent 53%),linear-gradient(130deg,#f5f9fce8,#f8f9fbed);box-shadow:0 20px 65px -25px #476d9754,0 3px 12px #3c659310,inset 0 1px 1px #ffffff;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);transform-origin:top left}
.picker-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 8px 13px;font-size:14px;font-weight:500;color:#5d7184}
.picker-heading>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.level{font-size:12px;color:#7f8b97;white-space:nowrap}
.search-wrap{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#ffffffa3;border:1px solid #ffffffd9;border-radius:13px;box-shadow:0 1px 3px #38669405}
.search-wrap:focus-within{border-color:#9dbfe2;box-shadow:0 0 0 3px #83b5e514}
.search-wrap>svg{width:20px;height:20px;flex-shrink:0;color:#768da3}
#search{width:100%;min-width:0;border:0;padding:0;color:#2a3c4e;font-size:16px;background:none;outline:none;line-height:24px}
#search::placeholder{color:#8192a2}
#search::-webkit-search-cancel-button{display:none}
.clear-search{display:grid;place-items:center;border:0;background:#e6edf4;color:#697f94;width:24px;height:24px;border-radius:8px;flex-shrink:0;font-size:20px;cursor:pointer;line-height:1}
.options{margin-top:10px;max-height:330px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#b9cddf transparent}
.option{width:100%;min-height:60px;display:flex;align-items:center;gap:12px;padding:9px 10px;border:1px solid transparent;border-radius:13px;background:transparent;cursor:pointer;text-align:left}
.option:hover,.option.is-active{background:#ffffffa6;border-color:#ffffffd9}
.option[aria-selected=true]{background:#ffffff68}
.option.is-active[aria-selected=true],.option[aria-selected=true]:hover{background:#ffffffc7;border-color:#fff}
.option .crumb-icon{width:36px;height:36px;border-radius:11px}
.option .crumb-icon svg{width:19px;height:19px}
.option-label{flex:1;min-width:0;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.option-code{font-size:12px;font-variant-numeric:tabular-nums;color:#8493a1}
.option-end{width:19px;height:19px;flex-shrink:0;color:#6c92b3}
.option-end.unselected{opacity:0}
.option:hover .option-end.unselected,.option.is-active .option-end.unselected{opacity:.7}
.empty{padding:35px 10px 30px;text-align:center;display:flex;flex-direction:column;gap:8px}
.empty>span:first-child{font-size:16px;color:#4d6274}
.empty>span:last-child{font-size:13px;color:#7a8b99;line-height:1.5}
.picker-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #d5e0ea80;margin:10px 5px 0;padding:12px 3px 0;color:#82909e;font-size:12px;min-height:31px}
.keyboard-help{display:flex;gap:4px;align-items:center}
.keyboard-help span{margin:0 6px 0 3px}
kbd{font:inherit;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;background:#ffffff72;border:1px solid #d7e1e8;border-radius:5px;color:#7c8fa0}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:1000px){main{padding:56px 64px}.crumb{min-height:80px;padding-right:20px}.crumb-label{font-size:19px}}
@media(max-width:600px){main{padding:26px 18px}.breadcrumbs{row-gap:13px}.crumb{min-height:67px;gap:10px;padding:10px 12px 10px 10px;border-radius:20px}.crumb-icon{width:36px;height:36px;border-radius:11px}.crumb-label{font-size:16px;letter-spacing:-.2px}.crumb-code{font-size:12px}.caret{margin-left:4px;width:13px}.connector{width:26px}.connector:before,.connector:after{width:4px}.crumb-add{width:46px;min-height:46px;padding:0}.picker{border-radius:22px}.keyboard-help{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

</style>
  
</head>
<body>
  <main>
    <nav class="navigation" aria-label="Хлебные крошки">
      <ol id="breadcrumbs" class="breadcrumbs"></ol>
    </nav>
    <section id="picker" class="picker" aria-label="Выбор раздела" hidden>
      <div class="picker-heading"><span id="picker-heading"></span><span class="level" id="level"></span></div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Найти раздел…" aria-label="Найти раздел на этом уровне" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="options" autocomplete="off" spellcheck="false">
        <button id="clear-search" class="clear-search" aria-label="Очистить поиск" hidden>×</button>
      </div>
      <div id="options" class="options" role="listbox" aria-label="Разделы"></div>
      <div id="empty" class="empty" hidden><span>Ничего не найдено</span><span>Попробуйте другое название или номер</span></div>
      <div class="picker-footer"><span id="result-count"></span><span class="keyboard-help"><kbd>↑</kbd><kbd>↓</kbd><span>выбрать</span><kbd>↵</kbd></span></div>
    </section>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  </main>
<script>
'use strict';
const icons = {
  folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" transform="translate(0 -1)"/>',
  pen:'<path d="m14 4 6 6M4 20l5-1L20 8a2.1 2.1 0 0 0-6-3L4 15l-1 6Z"/>',
  layout:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v10"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  layers:'<path d="m3 7 9-4 9 4-9 4Z M3 12l9 4 9-4M3 17l9 4 9-4"/>',
  code:'<path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/>',
  book:'<path d="M12 5C8 2 4 3 2 4v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-2-1-6-2-10 1Zm0 0v16"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6Z"/>',
  type:'<path d="M4 5V3h16v2M12 3v18M8 21h8"/>',
  file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 14h8M8 17h5"/>'
};
const palettes=[['#ddf0ff','#b8dcfc','#487dab'],['#ddfbf5','#a9e7dc','#3f8d81'],['#fff7d3','#f5dfa0','#a58b3e'],['#ece9ff','#d1c9f6','#8475b5'],['#ffede4','#f7cdb9','#b78066'],['#e3f1ff','#bed8f8','#6488b2']];
const svg=(body,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const chevron=svg('<path d="m8 5 7 7-7 7"/>');
const caret=svg('<path d="m5 9 7 7 7-7"/>','caret');
const rootNames=['Библиотека','Проекты','Команда','Архив'];
const branchNames=[['Дизайн','Разработка','Исследования','Материалы','Документы','Вдохновение'],['Веб-сайт','Приложение','Брендинг','Эксперименты'],['Продукт','Маркетинг','Аналитика'],['2026','2025','2024']];
const leafNames={ '1.1':['Интерфейсы','Типографика','Компоненты','Иконки','Палитры','Прототипы'], '1.2':['Фронтенд','Бэкенд','Инструменты'], '1.3':['Интервью','Наблюдения','Гипотезы'], '1.4':['Изображения','Иллюстрации','Шрифты'], '1.5':['Руководства','Заметки','Спецификации'], '1.6':['Референсы','Подборки','Идеи'] };
const kinds=['pen','code','compass','layers','file','book'];
const roots=rootNames.map((label,i)=>({id:String(i+1),label,icon:'folder',color:i,children:branchNames[i].map((name,j)=>{const id=`${i+1}.${j+1}`;return{id,label:name,icon:kinds[j%kinds.length],color:(j+1)%6,children:(leafNames[id]||['Обзор','Материалы','Заметки']).map((title,k)=>({id:`${id}.${k+1}`,label:title,icon:['layout','type','grid','layers','compass','pen'][k%6],color:(k+2)%6,children:[]}))};})}));
let path=[roots[0],roots[0].children[0],roots[0].children[0].children[0]];
let activeLevel=null,activeIndex=-1,filtered=[],openTimer,closeTimer;
let currentTrigger=null;
let hoverSuppressedUntil=0,openMode='hover';
const $=id=>document.getElementById(id);
const nav=$('breadcrumbs'),picker=$('picker'),search=$('search'),options=$('options');
const icon=node=>{const p=palettes[node.color];return`<span class="crumb-icon" style="--icon-light:${p[0]};--icon-color:${p[1]};--icon-ink:${p[2]}">${svg(icons[node.icon])}</span>`;};
function announce(message){$('announcement').textContent=message;}
function siblings(level){return level===0?roots:path[level-1].children;}
function cancelTimers(){clearTimeout(openTimer);clearTimeout(closeTimer);}
function closePicker(restoreFocus=false){
  cancelTimers();const trigger=currentTrigger;
  if(trigger)trigger.setAttribute('aria-expanded','false');
  picker.hidden=true;search.setAttribute('aria-expanded','false');search.removeAttribute('aria-activedescendant');activeLevel=null;currentTrigger=null;
  if(restoreFocus&&trigger?.isConnected)trigger.focus();
}
function scheduleClose(){clearTimeout(openTimer);clearTimeout(closeTimer);closeTimer=setTimeout(()=>{if(!picker.contains(document.activeElement))closePicker();},220);}
function renderPath(){
  nav.replaceChildren();
  const entries=[...path];if(path.at(-1)?.children.length)entries.push(null);
  entries.forEach((node,level)=>{
    const item=document.createElement('li');item.className='crumb-wrap';
    if(level){const join=document.createElement('span');join.className='connector';join.setAttribute('aria-hidden','true');join.innerHTML=chevron;item.append(join);}
    const button=document.createElement('button');button.type='button';button.className=node?'crumb':'crumb crumb-add';button.dataset.level=level;
    button.setAttribute('aria-haspopup','listbox');button.setAttribute('aria-expanded','false');button.setAttribute('aria-controls','options');
    if(node){button.innerHTML=`${icon(node)}<span class="crumb-copy"><span class="crumb-label">${node.label}</span><span class="crumb-code">${node.id}</span></span>${caret}`;button.setAttribute('aria-label',`${node.id} ${node.label}. Выбрать раздел этого уровня`);if(level===path.length-1)button.setAttribute('aria-current','page');}
    else{button.innerHTML=svg('<path d="M12 5v14M5 12h14"/>');button.setAttribute('aria-label','Открыть вложенные разделы');button.title='Вложенные разделы';}
    button.addEventListener('pointerenter',e=>{if(e.pointerType==='touch'||!matchMedia('(hover: hover)').matches||performance.now()<hoverSuppressedUntil)return;cancelTimers();if(activeLevel!==level)openTimer=setTimeout(()=>openPicker(level,button,false),140);});
    button.addEventListener('pointerleave',scheduleClose);
    button.addEventListener('click',()=>{if(activeLevel===level&&openMode==='activation'){closePicker(true);}else{openPicker(level,button,true);}});
    button.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();openPicker(level,button,true);if(e.key==='ArrowUp')setActive(filtered.length-1);}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const all=[...nav.querySelectorAll('button')];all[(level+(e.key==='ArrowRight'?1:all.length-1))%all.length].focus();}if(e.key==='Escape')closePicker(true);});
    item.append(button);nav.append(item);
  });
}
function placePicker(){
  if(!currentTrigger||picker.hidden)return;
  const r=currentTrigger.getBoundingClientRect();const margin=12;
  picker.style.width=`${Math.min(358,window.innerWidth-margin*2)}px`;
  const width=picker.getBoundingClientRect().width;
  picker.style.left=`${Math.max(margin,Math.min(r.left,window.innerWidth-width-margin))}px`;
  picker.style.top=`${r.bottom+12}px`;
  options.style.maxHeight=`${Math.max(80,Math.min(330,window.innerHeight-r.bottom-185))}px`;
  const height=picker.getBoundingClientRect().height;
  if(r.bottom+12+height>window.innerHeight-margin&&r.top>height+margin)picker.style.top=`${r.top-height-12}px`;
  else picker.style.top=`${Math.max(margin,Math.min(r.bottom+12,window.innerHeight-height-margin))}px`;
}
function openPicker(level,button,focus){
  cancelTimers();
  openMode=focus?'activation':'hover';
  if(activeLevel!==level){if(currentTrigger)currentTrigger.setAttribute('aria-expanded','false');activeLevel=level;currentTrigger=button;search.value='';activeIndex=-1;}
  $('picker-heading').textContent=level===0?'Все пространства':`В разделе «${path[level-1].label}»`;
  $('level').textContent=`Уровень ${level+1}`;
  picker.hidden=false;button.setAttribute('aria-expanded','true');search.setAttribute('aria-expanded','true');
  renderOptions();placePicker();if(focus)search.focus({preventScroll:true});
}
function plural(n){const t=n%100,u=n%10;return t>10&&t<20?'разделов':u===1?'раздел':u>=2&&u<=4?'раздела':'разделов';}
function renderOptions(){
  const query=search.value.trim().toLocaleLowerCase('ru').replaceAll('ё','е');
  filtered=siblings(activeLevel).filter(n=>`${n.label} ${n.id}`.toLocaleLowerCase('ru').replaceAll('ё','е').includes(query));
  options.replaceChildren();activeIndex=-1;search.removeAttribute('aria-activedescendant');
  filtered.forEach((node,i)=>{
    const selected=path[activeLevel]?.id===node.id;const option=document.createElement('button');
    option.type='button';option.className='option';option.id=`option-${node.id.replaceAll('.','-')}`;option.setAttribute('role','option');option.setAttribute('aria-selected',String(selected));option.tabIndex=-1;
    option.innerHTML=`${icon(node)}<span class="option-label">${node.label}</span><span class="option-code">${node.id}</span>${svg(selected?'<path d="m5 12 4 4L19 6"/>':'<path d="M5 12h14m-5-5 5 5-5 5"/>',`option-end${selected?'':' unselected'}`)}`;
    option.addEventListener('pointermove',()=>setActive(i,false));option.addEventListener('mousedown',e=>e.preventDefault());option.addEventListener('click',()=>selectNode(node));options.append(option);
  });
  $('empty').hidden=filtered.length!==0;$('clear-search').hidden=!search.value;$('result-count').textContent=`${filtered.length} ${plural(filtered.length)}`;placePicker();
}
function setActive(index,scroll=true){
  if(!filtered.length)return;activeIndex=(index+filtered.length)%filtered.length;
  [...options.children].forEach((el,i)=>el.classList.toggle('is-active',i===activeIndex));
  const option=options.children[activeIndex];search.setAttribute('aria-activedescendant',option.id);if(scroll)option.scrollIntoView({block:'nearest'});
}
function selectNode(node){
  const level=activeLevel;if(path[level]?.id===node.id){closePicker(true);return;}
  path=[...path.slice(0,level),node];hoverSuppressedUntil=performance.now()+500;closePicker();renderPath();nav.querySelector(`[data-level="${level}"]`).focus({preventScroll:true});
  announce(`Текущий путь: ${path.map(n=>`${n.id} ${n.label}`).join(', ')}${node.children.length?'. Доступны вложенные разделы.':''}`);
}
search.addEventListener('input',()=>{renderOptions();announce(`${filtered.length} ${plural(filtered.length)}`);});
$('clear-search').addEventListener('click',()=>{search.value='';renderOptions();search.focus();});
picker.addEventListener('pointerenter',cancelTimers);picker.addEventListener('pointerleave',scheduleClose);
picker.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closePicker(true);}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();setActive(activeIndex<0?(e.key==='ArrowDown'?0:filtered.length-1):activeIndex+(e.key==='ArrowDown'?1:-1));}else if(e.key==='Enter'&&e.target===search){e.preventDefault();const node=filtered[activeIndex<0?0:activeIndex];if(node)selectNode(node);}});
document.addEventListener('pointerdown',e=>{if(!picker.hidden&&!picker.contains(e.target)&&!currentTrigger?.contains(e.target))closePicker();});
document.addEventListener('focusin',e=>{if(!picker.hidden&&!picker.contains(e.target)&&e.target!==currentTrigger)closePicker();});
window.addEventListener('resize',placePicker);window.addEventListener('scroll',placePicker,{passive:true});
renderPath();

</script>
</body>
</html>
