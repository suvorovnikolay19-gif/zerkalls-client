<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes crumbPop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
body{margin:0;background:#fbfaf8;color:#1d1f21;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2f5fa8;text-decoration:none}
a:hover{color:#1f4380}
input{font:inherit}
::selection{background:#d9e4f5}
</style>
</helmet>
<div style="min-height:100vh;padding:56px 40px;display:flex;flex-direction:column;gap:40px">
  <div ref="{{ rootRef }}" style="position:relative;align-self:flex-start;max-width:100%">
    <nav aria-label="Хлебные крошки" style="display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:14px;line-height:20px">
      <sc-for list="{{ crumbs }}" as="crumb" hint-placeholder-count="3">
        <span style="display:flex;align-items:center;gap:2px;min-width:0">
          <sc-if value="{{ crumb.showSep }}" hint-placeholder-val="{{ true }}">
            <span aria-hidden="true" style="color:#b9b5ad;padding:0 4px;user-select:none">/</span>
          </sc-if>
          <button type="button" data-level="{{ crumb.level }}" onClick="{{ crumb.onClick }}" onPointerEnter="{{ crumb.onEnter }}" onPointerLeave="{{ crumb.onLeave }}" onKeyDown="{{ crumb.onKeyDown }}" aria-haspopup="listbox" style="display:flex;align-items:center;gap:5px;border:0;background:{{ crumb.bg }};color:{{ crumb.color }};font:inherit;font-weight:{{ crumb.weight }};letter-spacing:-0.1px;padding:5px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;transition:background .13s,color .13s" style-hover="background:#efede8;color:#1d1f21">
            <span style="overflow:hidden;text-overflow:ellipsis">{{ crumb.label }}</span>
            <svg viewBox="0 0 12 12" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity:{{ crumb.caretOpacity }};flex:none;transform:{{ crumb.caretFlip }};transition:opacity .13s,transform .16s"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"></path></svg>
          </button>
        </span>
      </sc-for>
      <sc-if value="{{ hasTrailing }}" hint-placeholder-val="{{ false }}">
        <span style="display:flex;align-items:center;gap:2px">
          <span aria-hidden="true" style="color:#b9b5ad;padding:0 4px;user-select:none">/</span>
          <button type="button" data-level="{{ trailing.level }}" onClick="{{ trailing.onClick }}" onPointerEnter="{{ trailing.onEnter }}" onPointerLeave="{{ trailing.onLeave }}" aria-label="Открыть вложенные разделы" aria-haspopup="listbox" style="display:flex;align-items:center;border:0;background:{{ trailing.bg }};color:#8d8880;padding:6px 7px;border-radius:7px;cursor:pointer;transition:background .13s,color .13s" style-hover="background:#efede8;color:#1d1f21">
            <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5v7M2.5 6h7"></path></svg>
          </button>
        </span>
      </sc-if>
    </nav>

    <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
      <div role="dialog" aria-label="Выбор раздела" onPointerEnter="{{ panelEnter }}" onPointerLeave="{{ panelLeave }}" onKeyDown="{{ panelKeyDown }}" style="position:absolute;z-index:20;left:{{ panelLeft }}px;top:{{ panelTop }}px;width:300px;background:#fff;border:1px solid #e6e2da;border-radius:10px;box-shadow:0 1px 2px rgba(29,31,33,.05),0 12px 28px -12px rgba(29,31,33,.22);animation:crumbPop .14s ease-out;overflow:hidden">
        <div style="display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid #f0ede7">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#a8a29a" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="flex:none"><circle cx="7" cy="7" r="4.25"></circle><path d="m10.2 10.2 3 3"></path></svg>
          <input ref="{{ searchRef }}" type="text" value="{{ query }}" onChange="{{ onQuery }}" placeholder="{{ placeholder }}" aria-label="Поиск на этом уровне" autocomplete="off" spellcheck="false" style="flex:1;min-width:0;border:0;outline:none;background:none;font-size:14px;line-height:20px;color:#1d1f21;padding:1px 0">
          <span style="font-size:11px;color:#a8a29a;font-variant-numeric:tabular-nums;flex:none">{{ count }}</span>
        </div>
        <div role="listbox" aria-label="Разделы" style="max-height:268px;overflow-y:auto;padding:5px;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin">
          <sc-for list="{{ items }}" as="item" hint-placeholder-count="5">
            <button type="button" role="option" aria-selected="{{ item.selected }}" onClick="{{ item.onClick }}" onPointerMove="{{ item.onHover }}" style="display:flex;align-items:center;gap:8px;width:100%;border:0;background:{{ item.bg }};color:#2c2e30;font:inherit;font-size:14px;line-height:20px;text-align:left;padding:7px 9px;border-radius:6px;cursor:pointer" style-hover="background:#f4f2ee">
              <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:{{ item.weight }}">{{ item.label }}</span>
              <sc-if value="{{ item.hasKids }}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 12 12" width="9" height="9" fill="none" stroke="#b5b0a7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m4.5 2.5 3.5 3.5-3.5 3.5"></path></svg>
              </sc-if>
            </button>
          </sc-for>
          <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
            <div style="padding:22px 10px 24px;text-align:center;font-size:13px;color:#8d8880">Ничего не найдено</div>
          </sc-if>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;max-width:640px">
    <h1 style="margin:0;font-size:26px;font-weight:600;letter-spacing:-0.5px">{{ title }}</h1>
    <p style="margin:0;font-size:14px;line-height:1.6;color:#6f6a63;text-wrap:pretty">{{ subtitle }}</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const TREE = [
  {label:'Электроника', children:[
    {label:'Ноутбуки', children:[
      {label:'Игровые', children:[{label:'17 дюймов'},{label:'15 дюймов'},{label:'Компактные'}]},
      {label:'Для работы', children:[{label:'Бизнес-серии'},{label:'С док-станцией'}]},
      {label:'Ультрабуки'},{label:'Трансформеры'},{label:'Аксессуары', children:[{label:'Сумки'},{label:'Подставки'},{label:'Блоки питания'}]}
    ]},
    {label:'Смартфоны', children:[{label:'Флагманы'},{label:'До 20 000 ₽'},{label:'Кнопочные'}]},
    {label:'Телевизоры', children:[{label:'OLED'},{label:'До 43 дюймов'},{label:'Кронштейны'}]},
    {label:'Наушники', children:[{label:'Полноразмерные'},{label:'Вкладыши'},{label:'Игровые гарнитуры'}]},
    {label:'Фото и видео', children:[{label:'Зеркальные'},{label:'Объективы'},{label:'Экшн-камеры'}]},
    {label:'Планшеты'},{label:'Мониторы'},{label:'Аудиотехника'}
  ]},
  {label:'Одежда и обувь', children:[{label:'Мужская'},{label:'Женская'},{label:'Детская'},{label:'Обувь'},{label:'Аксессуары'}]},
  {label:'Дом и сад', children:[{label:'Мебель'},{label:'Освещение'},{label:'Посуда'},{label:'Текстиль'},{label:'Инструменты'}]},
  {label:'Спорт и отдых', children:[{label:'Тренажёры'},{label:'Велосипеды'},{label:'Туризм'},{label:'Зимние виды'}]},
  {label:'Красота и здоровье', children:[{label:'Уход'},{label:'Парфюмерия'},{label:'Макияж'}]},
  {label:'Книги', children:[{label:'Художественная'},{label:'Нон-фикшн'},{label:'Детские'},{label:'Учебники'}]},
  {label:'Автотовары', children:[{label:'Шины и диски'},{label:'Автозвук'},{label:'Масла'}]},
  {label:'Детям', children:[{label:'Игрушки'},{label:'Коляски'},{label:'Школа'}]}
];
const kids = n => (n && n.children) || [];
const norm = s => s.toLocaleLowerCase('ru').replaceAll('ё','е');

class Component extends DCLogic {
  state = {path:[0,0,0], open:false, level:0, query:'', active:-1, left:0, top:0};
  rootRef = React.createRef();
  searchRef = React.createRef();

  nodeAt(i){ let list = TREE, node = null;
    for (const idx of this.state.path.slice(0, i+1)) { node = list[idx]; list = kids(node); }
    return node; }
  pathNodes(){ return this.state.path.map((_,i)=>this.nodeAt(i)); }
  siblings(level){ return level === 0 ? TREE : kids(this.nodeAt(level-1)); }

  place(level){
    const root = this.rootRef.current; if (!root) return {left:0, top:0};
    const btn = root.querySelector('[data-level="'+level+'"]'); if (!btn) return {left:0, top:0};
    const r = btn.getBoundingClientRect(), b = root.getBoundingClientRect();
    const left = Math.min(Math.max(0, r.left - b.left - 10), Math.max(0, window.innerWidth - 316 - b.left));
    return {left, top: r.bottom - b.top + 7};
  }
  openAt(level, focus){
    clearTimeout(this.tOpen); clearTimeout(this.tClose);
    const pos = this.place(level);
    this.setState({open:true, level, query:'', active:-1, ...pos});
    if (focus !== false) setTimeout(()=>this.searchRef.current && this.searchRef.current.focus({preventScroll:true}), 20);
  }
  close(){ clearTimeout(this.tOpen); clearTimeout(this.tClose); this.setState({open:false, active:-1, query:''}); }
  hoverOpen(level){ clearTimeout(this.tClose); clearTimeout(this.tOpen);
    if (this.state.open && this.state.level === level) return;
    this.tOpen = setTimeout(()=>this.openAt(level, true), 130); }
  hoverOut(){ clearTimeout(this.tOpen); clearTimeout(this.tClose);
    this.tClose = setTimeout(()=>this.close(), 220); }
  goTo(level){ clearTimeout(this.tOpen); this.setState(s=>({path:s.path.slice(0, level), open:false, query:'', active:-1})); }
  pick(level, index){ this.setState(s=>({path:[...s.path.slice(0, level), index], open:false, query:'', active:-1})); }

  visible(){
    const q = norm(this.state.query.trim());
    return this.siblings(this.state.level).map((n,i)=>({n,i})).filter(({n})=>norm(n.label).includes(q));
  }
  move(d){
    const list = this.visible(); if (!list.length) return;
    this.setState(s=>({active:(((s.active < 0 ? (d>0?-1:0) : s.active) + d) + list.length) % list.length}));
  }
  componentDidMount(){ this.onWin = ()=>{ if (this.state.open) this.setState(this.place(this.state.level)); };
    window.addEventListener('resize', this.onWin); window.addEventListener('scroll', this.onWin, {passive:true}); }
  componentWillUnmount(){ window.removeEventListener('resize', this.onWin); window.removeEventListener('scroll', this.onWin); clearTimeout(this.tOpen); clearTimeout(this.tClose); }

  renderVals(){
    const {open, level, query, active, path} = this.state;
    const nodes = this.pathNodes();
    const last = nodes[nodes.length-1];
    const openLevel = l => open && level === l;

    const crumbs = [{
      label:'Каталог', level:0, showSep:false,
      bg: openLevel(0) && path.length === 0 ? '#efede8' : 'transparent',
      color: path.length ? '#6f6a63' : '#1d1f21',
      weight: path.length ? '400' : '600',
      caretOpacity:'0', caretFlip:'none',
      onClick: ()=>this.goTo(0), onEnter: ()=>this.hoverOpen(0), onLeave: ()=>this.hoverOut(),
      onKeyDown: e => { if (e.key === 'ArrowDown'){ e.preventDefault(); this.openAt(0, true); } }
    }, ...nodes.map((n,i)=>({
      label:n.label, level:i, showSep:true,
      bg: openLevel(i) ? '#efede8' : 'transparent',
      color: i === nodes.length-1 ? '#1d1f21' : '#6f6a63',
      weight: i === nodes.length-1 ? '600' : '400',
      caretOpacity: openLevel(i) ? '.85' : '.45',
      caretFlip: openLevel(i) ? 'rotate(180deg)' : 'none',
      onClick: ()=>this.goTo(i+1), onEnter: ()=>this.hoverOpen(i), onLeave: ()=>this.hoverOut(),
      onKeyDown: e => { if (e.key === 'ArrowDown'){ e.preventDefault(); this.openAt(i, true); } }
    }))];

    const trailingLevel = nodes.length;
    const hasTrailing = kids(last).length > 0 || path.length === 0;
    const items = this.visible().map(({n,i}, vi)=>({
      label:n.label, selected: path[level] === i, hasKids: kids(n).length > 0,
      weight: path[level] === i ? '600' : '400',
      bg: vi === active ? '#f4f2ee' : (path[level] === i ? '#f7f5f1' : 'transparent'),
      onClick: ()=>this.pick(level, i),
      onHover: ()=>{ if (this.state.active !== vi) this.setState({active:vi}); }
    }));

    return {
      rootRef:this.rootRef, searchRef:this.searchRef, crumbs, hasTrailing,
      trailing:{ level:trailingLevel, bg: openLevel(trailingLevel) ? '#efede8' : 'transparent',
        onClick: ()=>this.openAt(trailingLevel, true), onEnter: ()=>this.hoverOpen(trailingLevel), onLeave: ()=>this.hoverOut() },
      open, panelLeft:this.state.left, panelTop:this.state.top, query,
      placeholder: level === 0 ? 'Поиск по категориям' : 'Поиск в «' + (this.nodeAt(level-1) || {}).label + '»',
      count: String(items.length), items, empty: items.length === 0,
      onQuery: e => this.setState({query:e.target.value, active:-1}),
      panelEnter: ()=>{ clearTimeout(this.tClose); clearTimeout(this.tOpen); },
      panelLeave: ()=>this.hoverOut(),
      panelKeyDown: e => {
        if (e.key === 'Escape'){ e.preventDefault(); this.close(); }
        else if (e.key === 'ArrowDown'){ e.preventDefault(); this.move(1); }
        else if (e.key === 'ArrowUp'){ e.preventDefault(); this.move(-1); }
        else if (e.key === 'Enter'){ e.preventDefault(); const list = this.visible(); const hit = list[active < 0 ? 0 : active]; if (hit) this.pick(level, hit.i); }
      },
      title: last ? last.label : 'Каталог',
      subtitle: nodes.length
        ? 'Наведите курсор на любой уровень пути — откроется список соседних разделов с поиском. Клик по названию просто вернёт вас на этот уровень.'
        : 'Наведите курсор на «Каталог» или нажмите +, чтобы выбрать раздел.'
    };
  }
}
</script>
</body>
</html>
